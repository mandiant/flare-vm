name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  powershell-security-tests:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run installer security checks
        shell: powershell
        run: scripts/test-security.ps1
      - name: Run installer preflight tests
        shell: powershell
        run: scripts/test-installer.ps1

  python-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install -r virtualbox/requirements-test.txt
      # Smoke check: every script must at least byte-compile. Catches broken refactors that a
      # style-only linter would miss (e.g. undefined names, syntax errors).
      - name: Byte-compile all scripts
        run: python -m py_compile virtualbox/*.py
      # Unit tests for the VBoxManage output parsers. `gi` (PyGObject) and VirtualBox are stubbed
      # / monkeypatched, so no VirtualBox install is required.
      - name: Run unit tests
        run: python -m pytest virtualbox/test_vbox_tools.py -q

  shell-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check shell script syntax
        run: bash -n virtualbox/install.sh
      - name: Run ShellCheck
        run: shellcheck virtualbox/install.sh
